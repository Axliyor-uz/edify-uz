<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    {% load static%}
    <link rel="stylesheet" href="{% static 'accounts/profile_style.css'%}">
    <style>
         body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 300px;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .role {
            font-weight: bold;
            color: #007BFF;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff4b5c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #e63946;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Welcome {{ user.username }}</h2>
    <p>Your role: <span class="role">{{ user.role }}</span></p>

    
{% if user.role == "teacher" %}
    <a href="{% url 'teacher:dashboard' %}">
        Continue as {{ user.username }}
    </a>

{% elif user.role == "student" %}
    <a href="{% url 'student:dashboard' %}">
        Continue as {{ user.username }}
    </a>

{% else %}
    <a href="{% url 'login' %}">
        Return to Login
    </a>
{% endif %}
</div>

</body>
</html>
