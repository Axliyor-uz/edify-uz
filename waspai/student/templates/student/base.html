<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Area{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --bg: #080d18; --bg-card: #0f1824; --bg-surface: #172030;
            --accent: #00c9a7; --accent-soft: rgba(0,201,167,0.12); --accent2: #7b6ff0;
            --text-primary: #eef2ff; --text-secondary: #7a90a8; --text-muted: #3e5060;
            --border: rgba(255,255,255,0.06); --border-strong: rgba(255,255,255,0.12);
            --radius: 14px; --radius-sm: 8px;
        }
        body { margin: 0; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; display: flex; }
        a { color: inherit; text-decoration: none; }
        .sidebar { width: 256px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
        .sidebar-logo { padding: 28px 24px 20px; border-bottom: 1px solid var(--border); }
        .logo-text { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; }
        .logo-text span { color: var(--accent); }
        .sidebar-user { padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: #fff; flex-shrink: 0; }
        .user-name { font-size: 13px; font-weight: 500; }
        .user-role { font-size: 11px; color: var(--text-secondary); }
        .sidebar-nav { flex: 1; padding: 12px; overflow-y: auto; }
        .nav-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); padding: 10px 12px 4px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 13.5px; transition: all 0.15s; margin-bottom: 1px; }
        .nav-item:hover, .nav-item.active { background: var(--accent-soft); color: var(--text-primary); }
        .nav-item.active { color: #66e8d0; }
        .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
        .nav-item:hover .nav-dot, .nav-item.active .nav-dot { background: var(--accent); }
        .sidebar-footer { padding: 14px 12px; border-top: 1px solid var(--border); }
        .main { margin-left: 256px; flex: 1; padding: 40px; min-height: 100vh; }
        .page-shell { max-width: 1200px; }
        .page-eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 600; letter-spacing: -0.3px; margin: 0; }
        .page-sub { font-size: 14px; color: var(--text-secondary); margin-top: 6px; }
        .messages { margin-bottom: 18px; }
        .message { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; color: var(--text-secondary); }
        .message.success { border-color: rgba(0,201,167,0.25); color: #66e8d0; }
        .message.info { border-color: rgba(123,111,240,0.25); }
        .header-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; gap: 16px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 32px; }
        .stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .stat-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 10px; }
        .stat-value { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; }
        .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
        .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 32px; }
        .quick-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; align-items: center; gap: 12px; transition: all 0.18s; }
        .quick-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0,201,167,0.1); }
        .q-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .q-title { font-size: 13px; font-weight: 500; color: var(--text-primary); }
        .q-desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
        .card-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 500; margin-bottom: 16px; }
        .enrolled-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .enrolled-item { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; display: flex; align-items: flex-start; gap: 10px; }
        .enrolled-bar { width: 4px; height: 40px; background: linear-gradient(180deg, var(--accent), var(--accent2)); border-radius: 2px; flex-shrink: 0; margin-top: 2px; }
        .enrolled-name { font-size: 13px; font-weight: 500; }
        .enrolled-teacher { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; border: none; transition: all 0.15s; }
        .btn-primary { background: var(--accent); color: #0a1a16; }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-joined { background: var(--bg-surface); color: var(--accent); border: 1px solid rgba(0,201,167,0.25); cursor: default; }
        .btn-joined::before { content: '✓ '; }
        .empty { text-align: center; padding: 32px; color: var(--text-secondary); font-size: 13px; }
        .classes-list { display: flex; flex-direction: column; gap: 14px; }
        .enroll-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0; overflow: hidden; display: flex; transition: all 0.18s; }
        .enroll-card:hover { border-color: rgba(0,201,167,0.3); transform: translateX(3px); }
        .enroll-stripe { width: 5px; background: linear-gradient(180deg, var(--accent), var(--accent2)); flex-shrink: 0; }
        .enroll-body { padding: 18px 22px; flex: 1; }
        .enroll-name { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 500; margin-bottom: 4px; }
        .enroll-teacher { font-size: 12px; font-weight: 500; color: var(--accent); margin-bottom: 8px; }
        .enroll-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .pill { display: inline-flex; align-items: center; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 100px; padding: 3px 10px; font-size: 11px; color: var(--text-secondary); }
        .pill-green { background: rgba(0,201,167,0.1); border-color: rgba(0,201,167,0.2); color: #66e8d0; }
        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-secondary); }
        .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 8px; color: var(--text-primary); }
        .classes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
        .class-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: all 0.18s; display: flex; flex-direction: column; }
        .class-card:hover { border-color: rgba(0,201,167,0.4); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,201,167,0.08); }
        .class-accent { height: 5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
        .class-body { padding: 20px; flex: 1; }
        .class-name { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 500; margin-bottom: 5px; }
        .class-teacher { font-size: 12px; color: var(--accent); margin-bottom: 10px; font-weight: 500; }
        .class-bio { font-size: 13px; color: var(--text-secondary); line-height: 1.6; min-height: 40px; }
        .class-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .my-classes-link { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: var(--radius-sm); background: var(--accent-soft); border: 1px solid rgba(0,201,167,0.2); color: #66e8d0; font-size: 13px; font-weight: 500; }
        .my-classes-link:hover { background: rgba(0,201,167,0.18); }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        .field input { width: 100%; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-primary); border-radius: 10px; padding: 12px 14px; font: inherit; }
        .field input:focus { outline: none; border-color: var(--accent); }
        .helper { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6; }
        .row { display:flex; justify-content:space-between; gap: 16px; padding: 12px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
        .row:last-child { border-bottom:none; }
        .key { color:#7a90a8; }
        .val { color:#eef2ff; text-align:right; }
        .actions { display:flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .secondary { background:#172030; color:#eef2ff; }
        .secondary:hover { filter: brightness(1.08); }
        @media (max-width: 900px) {
            body { display: block; }
            .sidebar { position: static; width: auto; height: auto; }
            .main { margin-left: 0; padding: 20px; }
        }

        .enroll-stripe {
  background: #ddd;
}

.enroll-stripe.submitted {
  background: linear-gradient(180deg, #00d4aa, #00a88a);
}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-text">Edu<span>Platform</span></div>
    </div>
    <div class="sidebar-user">
        <div class="avatar">{{ user.username|slice:":2"|upper }}</div>
        <div>
            <div class="user-name">{{ user.username }}</div>
            <div class="user-role">Student</div>
        </div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-label">Learning</div>
        <a href="{% url 'student:dashboard' %}" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}"><span class="nav-dot"></span> Dashboard</a>
        <a href="{% url 'student:my_classes' %}" class="nav-item {% if active_page == 'my_classes' %}active{% endif %}"><span class="nav-dot"></span> My Classes</a>
        <a href="{% url 'student:all_classes' %}" class="nav-item {% if active_page == 'all_classes' %}active{% endif %}"><span class="nav-dot"></span> Browse Classes</a>
        <a href="{% url 'student:teachers' %}" class="nav-item {% if active_page == 'teachers' %}active{% endif %}"><span class="nav-dot"></span> Teachers</a>
        <div class="nav-label">Account</div>
        <a href="{% url 'student:profile' %}" class="nav-item {% if active_page == 'profile' %}active{% endif %}"><span class="nav-dot"></span> Profile</a>
        <a href="{% url 'student:settings' %}" class="nav-item {% if active_page == 'settings' %}active{% endif %}"><span class="nav-dot"></span> Settings</a>
    </nav>
    <div class="sidebar-footer">
        <a href="{% url 'accounts:logout' %}" class="nav-item" style="color:#e05555;"><span class="nav-dot" style="background:#e05555;"></span> Log out</a>
    </div>
</aside>

<main class="main">
    <div class="page-shell">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</main>
</body>
</html>
