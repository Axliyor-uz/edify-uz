<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students — EduPlatform</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* KEEP YOUR ORIGINAL STYLES */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0e1a; --bg-card: #111827; --bg-surface: #1a2235;
  --accent: #6c63ff; --accent-soft: rgba(108,99,255,0.15); --accent2: #00d4aa;
  --text-primary: #f0f4ff; --text-secondary: #8899aa; --text-muted: #4a5568;
  --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.14);
  --radius: 14px; --radius-sm: 8px;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); display: flex; }

/* Sidebar (same) */
.sidebar { width: 256px; background: var(--bg-card); border-right: 1px solid var(--border); position: fixed; height: 100vh; }
.sidebar-logo { padding: 28px 24px; border-bottom: 1px solid var(--border); }
.logo-text { font-family: 'Playfair Display'; font-size: 20px; }
.logo-text span { color: var(--accent); }
.sidebar-user { padding: 16px; display: flex; gap: 10px; border-bottom: 1px solid var(--border); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; }
.sidebar-nav { padding: 12px; }
.nav-item { display:block; padding:8px 10px; color:var(--text-secondary); text-decoration:none; border-radius:6px; }
.nav-item.active, .nav-item:hover { background: var(--accent-soft); color:white; }

/* Main */
.main { margin-left:256px; padding:40px; width:100%; }
.page-title { font-family:'Playfair Display'; font-size:28px; margin-bottom:20px; }

/* Student grid */
.students-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.student-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  transition: 0.2s;
}

.student-card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
}

.student-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom: 10px;
}

.student-name {
  font-weight: 500;
  margin-bottom: 4px;
}

.student-meta {
  font-size: 12px;
  color: var(--text-secondary);
}
</style>
</head>

<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-text">Edu<span>Platform</span></div>
  </div>

  <div class="sidebar-user">
    <div class="avatar">{{ user.username|slice:":2"|upper }}</div>
    <div>{{ user.username }}</div>
  </div>

  <nav class="sidebar-nav">
    <a href="{% url 'teacher:dashboard' %}" class="nav-item">Dashboard</a>
    <a href="{% url 'teacher:allclasses' %}" class="nav-item">Classes</a>
    <a href="{% url 'teacher:students' %}" class="nav-item active">Students</a>
    <a href="{% url 'teacher:profile' %}" class="nav-item">Profile</a>
  </nav>
</aside>

<!-- Main -->
<main class="main">

  <h1 class="page-title">👨‍🎓 Your Students</h1>

  <div class="students-grid">
    {% for s in students %}
      <div class="student-card">
        <div class="student-avatar">
          {{ s.user.username|slice:":2"|upper }}
        </div>
        <div class="student-name">{{ s.user.username }}</div>
        <div class="student-meta">{{ s.user.email|default:"No email" }}</div>
      </div>
    {% empty %}
      <p>No students yet</p>
    {% endfor %}
  </div>

</main>

</body>
</html>
