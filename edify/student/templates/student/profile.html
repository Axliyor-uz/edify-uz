{% extends 'student/base.html' %}

{% block title %}Profile — EduPlatform{% endblock %}

{% block content %}
<div class="page-eyebrow">Account</div>
<h1 class="page-title">Your Profile</h1>

<div class="card" style="margin-top:24px; max-width: 720px;">
  <div class="row"><span class="key">Username</span><span class="val">{{ user.username }}</span></div>
  <div class="row"><span class="key">Email</span><span class="val">{{ user.email|default:"—" }}</span></div>
  <div class="row"><span class="key">Role</span><span class="val">Student</span></div>
  <div class="row"><span class="key">Classes joined</span><span class="val">{{ enrollment_count|default:0 }}</span></div>
  <div class="actions">
    <a class="btn" href="{% url 'student:settings' %}">Edit Profile</a>
    <a class="secondary" href="{% url 'student:dashboard' %}">Dashboard</a>
  </div>
</div>
{% endblock %}
