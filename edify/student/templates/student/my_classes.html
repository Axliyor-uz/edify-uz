<h2>Student Classes</h2>
<p>Welcome {{ user.username }}</p>

<a href="{% url 'student:all_classes' %}">add new class</a><br><br>

<a href="{% url 'student:dashboard' %}">Dashboard</a>
<h3>Your classes:</h3>

<ul>
    {% for enroll in enrollments %}
        <li>{{ enroll.course.name }}</li>
    {% empty %}
        <li>No classes yet</li>
    {% endfor %}
</ul>
