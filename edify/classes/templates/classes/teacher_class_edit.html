<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Class — EduPlatform</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* reuse your exact styles */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0e1a;
  --bg-card: #111827;
  --bg-surface: #1a2235;
  --accent: #6c63ff;
  --accent-soft: rgba(108,99,255,0.15);
  --accent2: #00d4aa;
  --text-primary: #f0f4ff;
  --text-secondary: #8899aa;
  --text-muted: #4a5568;
  --border: rgba(255,255,255,0.07);
  --radius: 14px;
  --radius-sm: 8px;
  --bg: #0a0e1a; --bg-card: #111827; --bg-surface: #1a2235; --bg-hover: #1e2d44;
  --accent: #6c63ff; --accent-soft: rgba(108,99,255,0.15); --accent2: #00d4aa;
  --text-primary: #f0f4ff; --text-secondary: #8899aa; --text-muted: #4a5568;
  --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.14);
  --radius: 14px; --radius-sm: 8px;
}
body {
      font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  display: flex;
     font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; display: flex; }
.sidebar { width: 256px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
.sidebar-logo { padding: 28px 24px 20px; border-bottom: 1px solid var(--border); }
.logo-text { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; }
.logo-text span { color: var(--accent); }
.sidebar-user { padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: #fff; flex-shrink: 0; }
.user-name { font-size: 13px; font-weight: 500; }
.user-role { font-size: 11px; color: var(--text-secondary); }
.sidebar-nav { flex: 1; padding: 12px; overflow-y: auto; }
.nav-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); padding: 10px 12px 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm); color: var(--text-secondary); text-decoration: none; font-size: 13.5px; transition: all 0.15s; margin-bottom: 1px; }
.nav-item:hover, .nav-item.active { background: var(--accent-soft); color: var(--text-primary); }
.nav-item.active { color: #a89fff; }
.nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
.nav-item:hover .nav-dot, .nav-item.active .nav-dot { background: var(--accent); }
.sidebar-footer { padding: 14px 12px; border-top: 1px solid var(--border); }
.main { margin-left: 256px; flex: 1; padding: 40px; min-height: 100vh; }
.page-eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; }
.page-title { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 600; letter-spacing: -0.3px; }
.page-sub { font-size: 14px; color: var(--text-secondary); margin-top: 6px; }
.header-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 32px; }
.stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
.stat-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 8px; }
.stat-value { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; }
.classes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.class-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: all 0.18s; }
.class-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108,99,255,0.14); }
.class-card-accent { height: 5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.class-card-body { padding: 20px; }
.class-name { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 500; margin-bottom: 6px; }
.class-bio { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; min-height: 40px; }
.class-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.pill { display: inline-flex; align-items: center; gap: 5px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 100px; padding: 4px 11px; font-size: 12px; color: var(--text-secondary); }
.pill.accent { background: var(--accent-soft); border-color: transparent; color: #a89fff; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }
.student-list { list-style: none; }
.student-list-header { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
.student-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.s-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-secondary); font-weight: 500; }
.s-name { font-size: 13px; color: var(--text-secondary); }
.empty { font-size: 13px; color: var(--text-muted); font-style: italic; padding: 4px 0; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; border: none; transition: all 0.15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #7c73ff; transform: translateY(-1px); }
.btn-back { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-strong); }
.btn-back:hover { color: var(--text-primary); }
.empty-state { text-align: center; padding: 80px 20px; color: var(--text-secondary); }
.empty-state h3 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 500; margin-bottom: 10px; color: var(--text-primary); }
.empty-state p { font-size: 14px; margin-bottom: 24px; }



.class-link {
  text-decoration: none;
  color: inherit;
  display: block;
}

.class-card {
  transition: 0.2s ease;
  cursor: pointer;
}

.class-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.sidebar {
  width: 256px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  position: fixed;
  height: 100vh;
}

/* MAIN */
.main {
  margin-left: 256px;
  padding: 40px;
  width: 100%;
}

/* HEADER */
.page-title {
  font-family: 'Playfair Display', serif;
  font-size: 30px;
  margin-bottom: 8px;
}

.page-sub {
  color: var(--text-secondary);
  margin-bottom: 30px;
}

/* FORM CARD */
.form-card {
  max-width: 700px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px;
}

/* INPUTS */
.form-group {
  margin-bottom: 20px;
}

.label {
  display: block;
  font-size: 13px;
  margin-bottom: 6px;
  color: var(--text-secondary);
}

.input, .textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-primary);
  font-size: 14px;
}

.textarea {
  min-height: 120px;
  resize: vertical;
}

/* BUTTONS */
.btn {
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  border: none;
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  margin-right: 10px;
}

.actions {
  margin-top: 20px;
  display: flex;
  justify-content: flex-end;
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-text">Edu<span>Platform</span></div>
  </div>
  <div class="sidebar-user">
    <div class="avatar">{{ user.username|slice:":2"|upper }}</div>
    <div>
      <div class="user-name">{{ user.username }}</div>
      <div class="user-role">Instructor</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Main</div>
    <a href="{% url 'teacher:dashboard' %}" class="nav-item"><span class="nav-dot"></span> Dashboard</a>
    <a href="{% url 'teacher:allclasses' %}" class="nav-item active"><span class="nav-dot"></span> All Classes</a>
    <a href="{% url 'teacher:assignments' %}" class="nav-item"><span class="nav-dot"></span> Assignments</a>
    <a href="{% url 'teacher:students' %}" class="nav-item"><span class="nav-dot"></span> Students</a>
    <div class="nav-label">Account</div>
    <a href="{% url 'teacher:profile' %}" class="nav-item"><span class="nav-dot"></span> Profile</a>
    <a href="{% url 'teacher:settings' %}" class="nav-item"><span class="nav-dot"></span> Settings</a>
  </nav>
  <div class="sidebar-footer">
    <a href="{% url 'accounts:logout' %}" class="nav-item" style="color:#e05555;"><span class="nav-dot" style="background:#e05555;"></span> Log out</a>
  </div>
</aside>
<main class="main">

  <h1 class="page-title">Edit Class</h1>
  <p class="page-sub">Update your class details and manage information.</p>

  <div class="form-card">
    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label class="label">Class Name</label>
        <input type="text" name="name" class="input" value="{{ class.name }}" required>
      </div>

      <div class="form-group">
        <label class="label">Description</label>
        <textarea name="bio" class="textarea">{{ class.bio }}</textarea>
      </div>

      <div class="actions">
        <a href="{% url 'teacher:allclasses' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>

    </form>
  </div>

</main>

</body>
</html>
