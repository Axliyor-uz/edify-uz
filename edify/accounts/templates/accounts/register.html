<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'accounts/register_style.css' %}">
</head>
<body>

<div class="form-box">
    <h2>Register</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>

    <a href="{% url 'accounts:login' %}">Already have an account?</a>
</div>

</body>
</html>
