<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    {% load static%}
    <link rel="stylesheet" href="{% static 'accounts/profile_style.css'%}">
</head>
<body>

<div class="card">
    <h2>Welcome {{ user.username }}</h2>
    <p>Your role: <span class="role">{{ user.role }}</span></p>

    
{% if user.role == "teacher" %}
    <a href="{% url 'teacher:dashboard' %}">
        Continue as {{ user.username }}
    </a>

{% elif user.role == "student" %}
    <a href="{% url 'student:dashboard' %}">
        Continue as {{ user.username }}
    </a>

{% else %}
    <a href="{% url 'login' %}">
        Return to Login
    </a>
{% endif %}
</div>

</body>
</html>
